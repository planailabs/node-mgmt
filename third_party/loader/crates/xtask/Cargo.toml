[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
description = "Project-agnostic loader build orchestrator: parses loader.toml, emits a ninja build graph + leaf commands (manifest generation, components manifest, update-server tarball, image-prep, upload). Run from the consumer's Makefile via `nix run .#xtask`."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
loader-engine = { path = "../loader-engine" }
loader-manifest = { path = "../loader-manifest" }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
