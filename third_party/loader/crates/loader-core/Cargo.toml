[package]
name = "loader-core"
version = "0.1.0"
edition = "2021"
description = "Project-agnostic loader runtime: shared HTTP client (net), the FHS-entry / component-mount / pool-discovery / splash / cache+lock substrate, the run lifecycle, the brand-parameterized lifecycle locales (i18n), and the crash-safe self-updater (update + apply). The consuming launcher re-exports these and drives them; project specifics (electron/control-plane/UI/flavour-detection) stay in the launcher."

[dependencies]
loader-manifest = { path = "../loader-manifest" }
anyhow = "1"
futures-util = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "fs", "time", "rt", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "stream", "gzip", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
which = "7"
fs2 = "0.4"
notify-rust = "4"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Brand-parameterized lifecycle locales (the launcher isn't Dioxus, so fluent direct).
fluent = "0.16"
unic-langid = "0.9"
