[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
description = "plan.ai USB build orchestrator: emits a ninja build graph + leaf commands (manifest generation, update-server tarball). Run from the Makefile via `nix run .#xtask`."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
plan-ai-manifest = { path = "../crates/manifest" }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Upload the already-built update tarball to a web-agency webspace (Cloudflare
# Pages). The few HTTP calls (whoami → POST tarball → poll status) are adopted
# from mac-mgmt's web-agency-upload CLI. rustls + RING (not aws-lc → no cmake).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
