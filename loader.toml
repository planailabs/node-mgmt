# loader.toml — the single declarative manifest the shared loader build tool (xtask,
# in the third_party/loader submodule) derives EVERYTHING from. Nothing plan.ai-specific
# lives in the engine; it all lives here. See third_party/loader for the engine.
#
# `@loader/<script>` in a cmd/src is rewritten to the loader scripts dir
# (third_party/loader/scripts) at render time; `./scripts/<script>` stays project-local.
schema = 1

# ── on-drive update manifest identity + classification ──────────────────────
[manifest]
product    = "plan-ai-usb"
update_url = "https://usb-update.plan.ai"

[manifest.classify]
exact = [
  ["plan-ai.linux-x64.exe",   "linux-x64"],
  ["plan-ai.linux-arm64.exe", "linux-arm64"],
  ["plan-ai.exe",             "win-x64"],
  ["plan-ai.dmg",             "mac-arm64"],
]
substring = [
  ["linux",   ["linux-x64", "linux-arm64"]],
  ["nixos",   ["linux-x64", "linux-arm64"]],
  ["darwin",  ["mac-arm64"]],
  ["-mac-",   ["mac-arm64"]],
  ["windows", ["win-x64"]],
  ["-win-",   ["win-x64"]],
]
tools = ["linux-x64", "linux-arm64"]

[manifest.feature_classify]
hermes    = ["hermes"]
llamacpp  = ["llamacpp"]
openwebui = ["runtime-", "ow-assets"]

[manifest.image_prep]
seed_features_default       = true
drop_default_off_from_image = true

[manifest.upload]
default_tarball = "dist/plan-ai-update.tar.gz"

# ── drive/bundle layout (consumed by the generalized bundle.sh + make-usb-image.sh) ──
[layout]
launcher_name  = "plan-ai"
image_name     = "plan-ai-usb.img"
volume_label   = "PLANAI"
launchers_dir  = "launchers"
components_dir = "components/{os}"
models_dir     = "models"
manifest_file  = "update.json"
selection_file = "platforms.json"
[layout.launcher_artifact]
"linux-x64"   = "plan-ai.linux-x64.exe"
"linux-arm64" = "plan-ai.linux-arm64.exe"
"win-x64"     = "plan-ai.exe"
"mac-arm64"   = "plan-ai.dmg"

# ── platforms ───────────────────────────────────────────────────────────────
[targets]
known       = ["linux-x64", "linux-arm64", "win-x64", "mac-arm64"]
select_env  = "PLANAI_PLATFORMS"
select_lock = "targets"
[targets.alias]
"nixos-x64"   = "linux-x64"
"nixos-arm64" = "linux-arm64"
[targets.os_match]
win = ["win", "windows"]
mac = ["mac", "darwin"]

# ── features (name + default-on) ────────────────────────────────────────────
[[feature]]
name = "openwebui"
default = true
[[feature]]
name = "hermes"
default = false
[[feature]]
name = "llamacpp"
default = false
[[feature]]
name = "mgmt"
default = false

# ── FHS package set (injected into buildFHSEnv by nix/loader) ─────────────────
[fhs]
name       = "planai-fhs"
run_script = 'exec "$@"'
systems    = ["x86_64-linux", "aarch64-linux"]
target_pkgs = [
  "glibc", "gcc-unwrapped.lib", "zlib",
  "glib", "gtk3", "nss", "nspr", "atk", "at-spi2-atk", "at-spi2-core",
  "cairo", "pango", "gdk-pixbuf", "cups", "dbus", "expat", "libdrm",
  "libxkbcommon", "mesa", "libgbm", "alsa-lib", "freetype", "fontconfig",
  "libGL", "systemd",
  "libx11", "libxcomposite", "libxcursor", "libxdamage",
  "libxext", "libxfixes", "libxi", "libxrender",
  "libxtst", "libxcb", "libxrandr", "libxscrnsaver",
]

# ── flavour key catalogs (per-GPU expansion for ollama / llama.cpp) ──────────
[flavours.ollama]
keys = ["linux-amd64", "linux-arm64", "linux-amd64-rocm", "darwin", "windows-amd64"]
[flavours.llamacpp]
keys = [
  "linux-amd64", "linux-amd64-vulkan", "linux-arm64", "linux-arm64-vulkan",
  "darwin", "windows-amd64", "windows-amd64-vulkan",
]

# ── leaf/source-producing steps (impure project scripts) ─────────────────────
[[step]]
name = "download"
cmd  = "./scripts/fetch-vendor.sh"
src  = ["usb.lock", "vendor.lock.json"]
desc = "download"
[[step]]
name = "wheel"
cmd  = "./scripts/build-openwebui.sh"
deps = ["download"]
desc = "openwebui wheel"
[[step]]
name = "app"
cmd  = "(cd app && npm ci)"
src  = ["app/package.json", "app/package-lock.json"]
desc = "electron deps"
[[step]]
name = "spa"
cmd  = "./scripts/build-spa.sh"
src_tree = ["launcher/spa-src"]
desc = "dioxus spa"
[[step]]
name = "runtime"
per  = "target"
cmd  = "./scripts/make-runtime.sh {target}"
deps = ["download"]
desc = "runtime {target}"
[[step]]
name = "models"
cmd  = "./scripts/seed-models.sh"
deps = ["download"]
src  = ["usb.lock", "./scripts/seed-models.sh", "@loader/lib.sh"]
desc = "seed models"

# ── shared source-input bundles ──────────────────────────────────────────────
[srcgroups]
pack   = ["@loader/pack-component.sh", "@loader/lib.sh"]
nix    = ["@loader/nix-component.sh", "@loader/lib.sh", "nix/builds.nix", "nix/stores.nix", "flake.nix"]
import = ["@loader/import-build-component.sh", "@loader/store-import.sh", "@loader/lib.sh", "nix/builds.nix", "nix/stores.nix", "flake.nix"]

# ── components ───────────────────────────────────────────────────────────────
# group 1 = the comp_jobs pass (ow-assets pack, runtime/target, ollama/flavour),
# group 2 = ow-assets sqfs/dmg, usbd, llamacpp, hermes, hermes-webui.

[[component]]
name = "ow-assets"
feature = "openwebui"
per = "shared"
group = 1
builder = "pack"
src_stamp = "wheel"
srcgroup = "pack"
stamp = "comp-ow-assets"
cmd = "@loader/pack-component.sh ow-assets"
desc = "pack ow-assets"

[[component]]
name = "runtime"
feature = "openwebui"
per = "target"
group = 1
builder = "import-build"
store_name = "runtime-{target}"
src_dir = "dist/runtime/{target}"
src_stamp = "runtime-{target}"
srcgroup = "import"
[component.format]
linux = { ext = "squashfs", attr = "runtime-{target}-squashfs", desc = "nix squashfs: runtime-{target}" }
mac   = { ext = "dmg",      attr = "runtime-{target}-dmg",      desc = "nix dmg: runtime-{target}" }
win   = { ext = "zip",      attr = "runtime-{target}-dir",      desc = "nix dir: runtime-{target}" }

[[component]]
name = "ollama"
feature = "openwebui"
per = "flavour"
flavour = "ollama"
group = 1
builder = "nix"
src_stamp = "download"
srcgroup = "nix"
[component.format]
linux = { ext = "squashfs", attr = "ollama-{key}-squashfs", desc = "nix squashfs: ollama-{key}" }
mac   = { ext = "dmg",      attr = "ollama-{key}-dmg",      desc = "nix dmg: ollama-{key}" }
win   = { ext = "zip",      attr = "ollama-{key}-dir",      desc = "nix component: ollama-{key}" }

[[component]]
name = "ow-assets-sqfs"
feature = "openwebui"
per = "shared"
group = 2
builder = "import-build"
store_name = "ow-assets"
src_dir = "vendor/ow-assets"
src_stamp = "wheel"
srcgroup = "import"
shared_os = "linux"
stamp = "comp-ow-assets-sqfs"
attr = "ow-assets-squashfs"
out  = "dist/components/ow-assets.squashfs"
desc = "nix squashfs: ow-assets"

[[component]]
name = "ow-assets-dmg"
feature = "openwebui"
per = "shared"
group = 2
builder = "import-build"
store_name = "ow-assets"
src_dir = "vendor/ow-assets"
src_stamp = "wheel"
srcgroup = "import"
shared_os = "mac"
stamp = "comp-ow-assets-dmg"
attr = "ow-assets-dmg"
out  = "dist/components/ow-assets.dmg"
desc = "nix dmg: ow-assets"

[[component]]
name = "usbd"
feature = "core"
per = "target"
group = 2
builder = "nix"
srcgroup = "nix"
[component.format]
linux = { ext = "squashfs", attr = "usbd-{target}-squashfs", desc = "nix component: usbd-{target}" }
mac   = { ext = "dmg",      attr = "usbd-{target}-dmg",      desc = "nix component: usbd-{target}" }
win   = { ext = "zip",      attr = "usbd-{target}-dir",      desc = "nix component: usbd-{target}" }

[[component]]
name = "llamacpp"
feature = "llamacpp"
per = "flavour"
flavour = "llamacpp"
group = 2
builder = "nix"
srcgroup = "nix"
[component.format]
linux = { ext = "squashfs", attr = "llamacpp-{key}-squashfs", desc = "nix component: llamacpp-{key}" }
mac   = { ext = "dmg",      attr = "llamacpp-{key}-dmg",      desc = "nix component: llamacpp-{key}" }
win   = { ext = "zip",      attr = "llamacpp-{key}-dir",      desc = "nix component: llamacpp-{key}" }

[[component]]
name = "hermes"
feature = "hermes"
per = "target"
group = 2
builder = "nix"
srcgroup = "nix"
src_extra = ["nix/hermes.nix"]
src_tree  = ["hermes"]
[component.format]
linux = { ext = "squashfs", attr = "hermes-{target}-squashfs", desc = "nix component: hermes-{target}" }
mac   = { ext = "dmg",      attr = "hermes-{target}-dmg",      desc = "nix component: hermes-{target}" }
win   = { ext = "zip",      attr = "hermes-{target}-dir",      desc = "nix component: hermes-{target}" }

[[component]]
name = "hermes-webui"
feature = "hermes"
per = "shared-os"
group = 2
builder = "nix"
srcgroup = "nix"
[component.format]
linux = { ext = "squashfs", attr = "hermes-webui-squashfs", out = "dist/components/hermes-webui.squashfs", stamp = "comp-hermes-webui-squashfs", desc = "nix component: hermes-webui-squashfs" }
mac   = { ext = "dmg",      attr = "hermes-webui-dmg",      out = "dist/components/hermes-webui.dmg",      stamp = "comp-hermes-webui-dmg",      desc = "nix component: hermes-webui-dmg" }
win   = { ext = "zip",      attr = "hermes-webui-dir",      out = "dist/components/hermes-webui.zip",      stamp = "comp-hermes-webui-zip",      desc = "nix component: hermes-webui-dir" }

# ── bundle + final artifacts ──────────────────────────────────────────────────
[bundle]
per = "target"
cmd = "@loader/bundle.sh {target}"
deps = ["components", "spa", "app"]
src  = ["launcher/Cargo.toml", "launcher/Cargo.lock", "spinner/Cargo.toml", "spinner/Cargo.lock", "@loader/bundle.sh", "@loader/lib.sh", "flake.nix"]
src_tree = ["launcher/src", "spinner/src", "crates"]
desc = "bundle {target}"

[[artifact]]
name = "image"
out  = "dist/plan-ai-usb.img"
cmd  = "@loader/make-usb-image.sh"
deps_bundles = true
deps_steps   = ["models"]
src  = ["@loader/make-usb-image.sh", "@loader/lib.sh", "flake.nix"]
src_tree = ["xtask/src", "crates"]
desc = "usb image"
default = true

[[artifact]]
name = "update-tarball"
out  = "dist/plan-ai-update.tar.gz"
cmd  = "./scripts/make-update-tarball.sh"
deps_bundles = true
src  = ["./scripts/make-update-tarball.sh"]
src_tree = ["xtask/src", "crates"]
desc = "update tarball"

[[launch]]
name = "dev"
cmd  = "./scripts/dev.sh"

# ── Makefile (generated by `xtask gen-makefile`, committed so it can trigger xtask) ──
# The engine renders a generic preamble (TARGET/PLATFORMS knobs + nix-develop guard +
# the XTASK wrapper + a help target) and then one rule per [[make.target]]. Recipe
# lines are emitted tab-indented verbatim; `xtask` in a recipe expands to `xtask_cmd`.
[make]
xtask_cmd    = "nix run .#xtask --"
devshell_var = "PLANAI_DEVSHELL"
guard_exclude = ["clean", "help"]
default_goal = "all"

[[make.target]]
name = "all"
help = "build EVERY target (mac/win/linux/nixos) + image (via ninja)"
recipe = ["$(XTASK) build all"]
[[make.target]]
name = "ninja"
help = "(re)generate build.ninja from the artifact graph"
recipe = ["$(XTASK) gen-ninja"]
[[make.target]]
name = "makefile"
help = "(re)generate this Makefile from loader.toml"
recipe = ["$(XTASK) gen-makefile"]
[[make.target]]
name = "runtimes"
help = "build the python runtime for every target"
recipe = ["$(XTASK) build runtimes"]
[[make.target]]
name = "components"
help = "pack modular component archives (runtimes + all ollama flavours + assets)"
recipe = ["$(XTASK) build components"]
[[make.target]]
name = "bundles"
help = "package every target from the components"
recipe = ["$(XTASK) build bundles"]
[[make.target]]
name = "update-tarball"
help = "update-server tarball (manifest.json + files/) for the update URL"
recipe = ["$(XTASK) build update-tarball"]
[[make.target]]
name = "tarball-upload"
help = "upload the update tarball to a web-agency webspace (set WEB_AGENCY_TOKEN + WEB_AGENCY_URL [+ WEB_AGENCY_WEBSPACE_ID])"
deps = ["update-tarball"]
recipe = ["$(XTASK) upload"]
[[make.target]]
name = "download"
help = "materialise vendored downloads from Nix FODs (cached) into vendor/"
recipe = ["$(XTASK) build download"]
[[make.target]]
name = "wheel"
help = "build open-webui frontend+wheel + prefetch offline assets"
recipe = ["$(XTASK) build wheel"]
[[make.target]]
name = "app"
help = "install the thin Electron shell deps"
recipe = ["$(XTASK) build app"]
[[make.target]]
name = "spa"
help = "build the Dioxus SPA dashboard into launcher/spa/ (nix build .#spa)"
recipe = ["$(XTASK) build spa"]
[[make.target]]
name = "runtime"
help = "relocatable python runtime for TARGET"
recipe = ["$(XTASK) build runtime-$(TARGET)"]
[[make.target]]
name = "bundle"
help = "package single-file artifact for TARGET"
recipe = ["$(XTASK) build bundle-$(TARGET)"]
[[make.target]]
name = "image"
help = "ready-to-burn FAT32 USB image (all artifacts < 4 GiB; reads everywhere)"
recipe = ["$(XTASK) build image"]
[[make.target]]
name = "models"
help = "pre-pull usb.lock models into ./models (cached; also auto-run by `make image`)"
recipe = ["$(XTASK) build models"]
[[make.target]]
name = "dev"
help = "minimal NixOS build + run (development mode)"
recipe = ["./scripts/dev.sh"]
[[make.target]]
name = "dev-spa"
help = "launch the bundle with a locally built SPA (scripts/build-spa.sh)"
recipe = ["./scripts/build-spa.sh", "dist/bundle/plan-ai.linux-x64.exe --start-with-spa launcher/spa"]
[[make.target]]
name = "dev-electron"
help = "launch the bundle with the local app/ tree (needs: cd app && npm i)"
recipe = ["dist/bundle/plan-ai.linux-x64.exe --start-with-electron app"]
[[make.target]]
name = "dev-usbd"
help = "launch the bundle with a locally built usbd (cargo build --release)"
recipe = ["cd usbd && cargo build --release", "dist/bundle/plan-ai.linux-x64.exe --start-with-usbd usbd/target/release/usbd"]
[[make.target]]
name = "vendor-lock"
help = "regenerate vendor.lock.json (run when usb.lock bumps)"
recipe = ["./scripts/gen-vendor-lock.sh"]
[[make.target]]
name = "update"
help = "regenerate ALL locks after bumping usb.lock (vendor + uv + npm)"
recipe = ["./scripts/update-locks.sh"]
[[make.target]]
name = "update-deps"
help = "bump ollama/open-webui/llmfit/pbs/python to latest + regen locks"
recipe = ["./scripts/update-deps.sh"]
[[make.target]]
name = "test"
help = "lint + runtime import + live ollama/open-webui health"
recipe = ["./scripts/test-build.sh"]
[[make.target]]
name = "test-nixos"
help = "launch the built nixos bundle under xvfb + screenshot"
recipe = ["./scripts/test-nixos.sh"]
[[make.target]]
name = "test-usb"
help = "FAT32 loop-image launch test (models/data on FAT32)"
recipe = ["./scripts/test-usb-image.sh"]
[[make.target]]
name = "test-vm"
help = "run the AppImage in an Ubuntu 26.04 incus VM"
recipe = ["./scripts/test-ubuntu-vm.sh"]
[[make.target]]
name = "test-all"
help = "every test (build/health, nixos, FAT32, ubuntu VM; +mac/win if MAC_TARGET/WIN_TARGET set)"
recipe = [
  "./scripts/test-build.sh",
  "./scripts/test-nixos.sh",
  "./scripts/test-usb-image.sh",
  "./scripts/test-ubuntu-vm.sh",
  "@if [ -n \"$(MAC_TARGET)\" ]; then ./scripts/test-mac.sh; else echo \"== skip test-mac (MAC_TARGET unset) ==\"; fi",
  "@if [ -n \"$(WIN_TARGET)\" ]; then ./scripts/test-win.sh; else echo \"== skip test-win (WIN_TARGET unset) ==\"; fi",
]
[[make.target]]
name = "ui"
help = "preview the SPA against the mock backend (dx serve + mock API on :9999)"
recipe = [
  "@echo \"==> tailwind + mock API (:9999) + dx serve (hot reload)\"",
  "( cd launcher/spa-src && tailwindcss -i ../../third_party/plan-ai-design/assets/input.css \\",
  "    -o assets/tailwind.css --config tailwind.config.js ) ; \\",
  "  cargo run --manifest-path mock-server/Cargo.toml & \\",
  "  trap 'kill %1 2>/dev/null' EXIT INT TERM ; \\",
  "  ( cd launcher/spa-src && dx serve | cat )",
]
[[make.target]]
name = "seed"
help = "alias of models (pre-pull usb.lock models into ./models)"
deps = ["models"]
recipe = []
[[make.target]]
name = "ollama"
recipe = ["./scripts/download-ollama.sh"]
[[make.target]]
name = "openwebui"
recipe = ["./scripts/download-openwebui.sh"]
[[make.target]]
name = "download-curl"
help = "legacy curl-based fetch (no Nix); `make download` (FODs) is preferred"
deps = ["ollama", "openwebui"]
recipe = []
[[make.target]]
name = "test-clean"
help = "wipe build outputs and rebuild from scratch (TARGET=linux-x64)"
recipe = ["./scripts/test-clean-build.sh $(TARGET)"]
[[make.target]]
name = "test-mac"
help = "run the mac launcher on a remote mac (set MAC_TARGET=<ssh host>)"
recipe = ["./scripts/test-mac.sh"]
[[make.target]]
name = "test-win"
help = "run the win launcher on a remote windows box (set WIN_TARGET=<ssh host>)"
recipe = ["./scripts/test-win.sh"]
[[make.target]]
name = "clean"
help = "remove all build outputs (ninja graph + dist + every crate's target/)"
recipe = [
  "@if [ -f build.ninja ] && command -v ninja >/dev/null 2>&1; then echo \"ninja -t clean\"; ninja -f build.ninja -t clean >/dev/null 2>&1 || true; fi",
  "rm -rf dist build.ninja .ninja_log .ninja_lock app/node_modules app/.stage app/.stage.lock launcher/target launcher/spa-src/target launcher/spa-src/.cargo spinner/target mock-server/target crates/*/target third_party/loader/crates/*/target",
]
