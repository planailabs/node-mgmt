[package]
name = "plan-ai-spinner"
version = "0.1.0"
edition = "2021"
description = "Tiny native splash window (animated spinner) shown while the launcher mounts the runtime, before Electron's window appears."

[[bin]]
name = "plan-ai-spinner"
path = "src/main.rs"

[dependencies]
# CLI args (--text / --progress / --title)
clap = { version = "4", features = ["derive"] }

# The eframe backend is chosen per target (each cross-build is a single platform, so
# the features resolve cleanly):
#
# Windows -> wgpu (Direct3D 12/11, with a WARP *software* adapter when there's no GPU).
# glow needs a desktop OpenGL ≥2.0 context, which is absent on many Windows VMs / RDP /
# headless sessions (only GDI GL 1.1) — there the splash never came up ("egui_glow
# requires opengl 2.0+"). wgpu renders via D3D instead. pollster block_on's the one-shot
# adapter/device request we do before the window opens (see wgpu_adapter_config).
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }
pollster = "0.4"

# macOS / Linux -> glow (OpenGL). These have a working desktop GL (and NixOS uses the
# launcher's dialog/terminal fallback instead of eframe), and glow keeps the binary
# lean — notably it avoids wgpu's extra libobjc link on macOS, which modern dyld
# SIGABRTs on as a duplicate. glow/winit dlopen the system GL/windowing libs at runtime,
# so a NixOS-cross-built binary still resolves the target's own libs. accesskit is
# dropped (a splash needs no screen-reader, and it's a cross-compile pain point).
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
