[package]
name = "plan-ai-spinner"
version = "0.1.0"
edition = "2021"
description = "Tiny native splash window (animated spinner) shown while the launcher mounts the runtime, before Electron's window appears."

[[bin]]
name = "plan-ai-spinner"
path = "src/main.rs"

[dependencies]
# CLI args (--text / --progress / --title / --selftest)
clap = { version = "4", features = ["derive"] }
# The splash is rendered on the CPU and blitted to the window via the OS 2D path
# (GDI on Windows, CoreGraphics on macOS, X11/Wayland shm on Linux) — NOT a GPU/GL/D3D
# backend. eframe's glow needed desktop OpenGL ≥2.0 and wgpu needed a Direct3D adapter,
# neither of which exists on a display-only VM (e.g. a virtio "DOD" GPU) or many
# RDP/headless sessions, so the splash never came up there. softbuffer needs only a
# window + a framebuffer copy, so it renders anywhere a window can be shown.
winit = "0.30"
softbuffer = "0.4"
# Anti-aliased text via a real sans-serif font (Roboto-Regular, vendored under
# assets/). plan-ai-design's font is Inter, but nixpkgs only ships it as a variable
# font; Roboto is a static, metric-clean stand-in with the same geometric sans feel.
fontdue = "0.9"

[profile.release]
opt-level = "z"
lto = true
strip = true
