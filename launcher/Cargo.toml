[package]
name = "plan-ai-launcher"
version = "0.1.0"
edition = "2021"
description = "Tiny native launcher: locate the shared components beside it and start the bundled Electron app (first step of moving logic to Rust)."

[[bin]]
name = "plan-ai"
path = "src/main.rs"

[dependencies]
# the supervisor/control plane (ported from app/main/*.js into rust). Sourced via
# the `mac-mgmt` flake input, copied into vendor/ at build time (see flake.nix).
mac-mgmt-services = { path = "vendor/mac-mgmt-services" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util", "sync", "signal", "fs"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
# cross-platform advisory file lock for the single-instance guard
fs2 = "0.4"
# locate a dialog tool (zenity/kdialog/yad) on $PATH for the NixOS splash fallback
which = "7"
# FTL (Fluent) translations for the user-facing notifications, mirroring the
# SPA's dioxus-i18n FTL approach (the launcher isn't Dioxus, so fluent direct).
fluent = "0.16"
unic-langid = "0.9"
# serve the embedded Dioxus SPA + control API over localhost (phase 3)
axum = "0.8"
rust-embed = "8"
mime_guess = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
# Cross-platform desktop notification (e.g. "already running"): Linux D-Bus,
# Windows winrt toast, macOS Cocoa. macOS needs the Apple SDK headers at
# cross-compile time — the flake feeds them in via SDKROOT (see flake.nix
# `macosx-sdk`); zig handles Linux + Windows directly.
notify-rust = "4"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
