[package]
name = "plan-ai-manifest"
version = "0.1.0"
edition = "2021"
description = "Shared update-manifest schema, platform classification, sha256 + diff. Used by both the build tool (xtask) and the launcher updater so there is one source of truth (no schema drift)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
