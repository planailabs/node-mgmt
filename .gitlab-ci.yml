# Runs on the plan.ai `nix-image` runners (NixOS-in-Incus image built from
# `.#image` in flake.nix, nix preconfigured against the xzar binary cache). Every
# job runs inside `nix develop` so CI uses the exact devshell toolchain (node,
# python, uv, electron, rust+wasm, dx, rcodesign, wine, mtools, …) as locally.
# Cross builds (mac/win) are produced from the Linux runner. Modelled on
# plan-ai/mac-mgmt's nix-image CI.

stages:
  - build
  - deploy

before_script:
  # The nix-image executor mounts /cache for Cargo; initialise the target before
  # symlinking so nested tools (dx, cargo-zigbuild) share one warm cache instead
  # of racing on a half-created ~/.cargo. (Pattern from mac-mgmt.)
  - mkdir -p /cache/cargo
  - rm -rf ~/.cargo
  - ln -s /cache/cargo ~/.cargo
  - export CARGO_HOME="$HOME/.cargo"

variables:
  GIT_SUBMODULE_STRATEGY: recursive   # plan-ai-design, mac-mgmt, loader (build framework)

# Build the devshell + CI image and push them to the xzar cache so downstream
# jobs and future pipelines resolve them from the cache. Doubles as the flake
# sanity check on every pipeline (XZAR_TOKEN absent on unprotected → build-only).
build:
  stage: build
  tags: [nix-image]
  script:
    - bash prebuild.sh
  # 6h, not 3h. The nightly flake-input refresh bumps nixpkgs, which changes the
  # derivation of every package in the devshell — including the multilib
  # `wine-wow-11.0` that the Windows electron-builder rcedit step needs and that
  # no public cache serves. A cold wine-wow build alone does not fit in 3h:
  # pipeline 2987 (job 7370) spent 2h52m inside `wine-wow>` (still compiling
  # dlls when the 4 MB trace cap was hit) and was killed at 11104s as
  # `job_token_expired` before `.#image` was even reached, so xzar never warmed
  # and every later pipeline repeated the cold build. This is headroom, not a
  # speed fix — warm runs of this job take 355-1200s (jobs 7232/7256/7297) and
  # the fleet's equivalent warmer (plan-ai/mac-mgmt `build`) already runs at 6h
  # for the same reason. Per-step trace output still bounds a genuine hang.
  timeout: 6h
  resource_group: build-cache

# Build every platform's bundle (linux/win/mac), assemble the all-platform USB
# update tarball (manifest.json + files/ mirror of each launcher + its
# components/<os>/), and publish it to the update URL. Needs WEB_AGENCY_TOKEN +
# WEB_AGENCY_URL (+ optional WEB_AGENCY_WEBSPACE_ID) as protected CI variables.
update-tarball:
  stage: deploy
  tags: [nix-image]
  only: [trunk]
  script:
    - nix develop -c make bundles
    - nix develop -c make tarball-upload
  # 6h, not 3h — same budget as `build`. `make bundles` subsumes the whole
  # component graph (43 nodes producing ~11 GiB of squashfs/dmg/zip output), and
  # several of those nodes are NOT substitutable: the open-webui wheel + offline
  # HF assets in `ow-assets` are rebuilt every pipeline, and every dmg is packed
  # in a KVM VM. Pipeline 3073 (job 7586) measured the stage at 2h22m (ow-assets squashfs
  # 69m, ow-assets dmg 13m, ollama-windows zip 25m, usbd-mac-arm64 dmg 12m) and
  # was then killed by the 3h cap 37m into the bundle step with no failing step
  # (`job_token_expired` at 11117s, zero error lines) — the electron/zlib legs
  # had no room left. This is headroom, not a speed fix: the per-pipeline cost
  # comes from the impure open-webui build and VM-packed dmgs, which still need
  # a cacheable/FOD treatment. Ninja buffers per-edge output, so the last
  # printed line is the last completed node — headroom is also what makes a
  # genuine hang distinguishable from a slow node.
  timeout: 6h
  environment: production
  resource_group: production
