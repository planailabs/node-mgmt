# Runs on the plan.ai `nix-image` runners (NixOS-in-Incus image built from
# `.#image` in flake.nix, nix preconfigured against the xzar binary cache). Every
# job runs inside `nix develop` so CI uses the exact devshell toolchain (node,
# python, uv, electron, rust+wasm, dx, rcodesign, wine, mtools, …) as locally.
# Cross builds (mac/win) are produced from the Linux runner. Modelled on
# plan-ai/mac-mgmt's nix-image CI.

stages:
  - build
  - deploy

before_script:
  # The nix-image executor mounts /cache for Cargo; initialise the target before
  # symlinking so nested tools (dx, cargo-zigbuild) share one warm cache instead
  # of racing on a half-created ~/.cargo. (Pattern from mac-mgmt.)
  - mkdir -p /cache/cargo
  - rm -rf ~/.cargo
  - ln -s /cache/cargo ~/.cargo
  - export CARGO_HOME="$HOME/.cargo"

variables:
  GIT_SUBMODULE_STRATEGY: recursive   # plan-ai-design, mac-mgmt, loader (build framework)

# Build the devshell + CI image and push them to the xzar cache so downstream
# jobs and future pipelines resolve them from the cache. Doubles as the flake
# sanity check on every pipeline (XZAR_TOKEN absent on unprotected → build-only).
build:
  stage: build
  tags: [nix-image]
  script:
    - bash prebuild.sh
  # 6h, not 3h. The nightly flake-input refresh bumps nixpkgs, which changes the
  # derivation of every package in the devshell — including the multilib
  # `wine-wow-11.0` that the Windows electron-builder rcedit step needs and that
  # no public cache serves. A cold wine-wow build alone does not fit in 3h:
  # pipeline 2987 (job 7370) spent 2h52m inside `wine-wow>` (still compiling
  # dlls when the 4 MB trace cap was hit) and was killed at 11104s as
  # `job_token_expired` before `.#image` was even reached, so xzar never warmed
  # and every later pipeline repeated the cold build. This is headroom, not a
  # speed fix — warm runs of this job take 355-1200s (jobs 7232/7256/7297) and
  # the fleet's equivalent warmer (plan-ai/mac-mgmt `build`) already runs at 6h
  # for the same reason. Per-step trace output still bounds a genuine hang.
  timeout: 6h
  resource_group: build-cache

# Warm the xzar cache with the closures `update-tarball` would otherwise rebuild
# from scratch: the Dioxus SPA (~82 min cold), the four `hermes-*` components
# (~60 min) and the four `runtime-*` wheel installs (~38 min). They depend on
# nixpkgs + the vendored FODs only (never on the git tree), so pinning them is
# stable across commits; see `scripts/warm-deploy-cache.sh`. Pipeline 3098 (job
# 7664) is why: a garbage-collected runner store forced 1041 fresh derivations
# inside the deploy job and the 6h cap killed it at node 29/43. Kept out of
# `build` so a cold devshell (the `wine-wow-11.0` case, ~5h) can't push that job
# over its own budget. Runs on trunk only — that is the only ref with a deploy
# stage and with XZAR_TOKEN available for the upload.
warm-deploy-cache:
  stage: build
  tags: [nix-image]
  only: [trunk]
  script:
    - bash scripts/warm-deploy-cache.sh
  # Cold warming of all nine closures measured ~3h (job 7664's per-node times);
  # 4h covers a nixpkgs bump that invalidates every one of them at once.
  timeout: 4h
  # Its own group, so two pipelines never warm the same pins at once, without
  # serializing behind `build`'s build-cache group.
  resource_group: cache-warm

# Build every platform's bundle (linux/win/mac), assemble the all-platform USB
# update tarball (manifest.json + files/ mirror of each launcher + its
# components/<os>/), and publish it to the update URL. Needs WEB_AGENCY_TOKEN +
# WEB_AGENCY_URL (+ optional WEB_AGENCY_WEBSPACE_ID) as protected CI variables.
update-tarball:
  stage: deploy
  tags: [nix-image]
  only: [trunk]
  script:
    # Runner-resource diagnostics. This all-platform job has now died three times on
    # a runner ceiling with nothing in the trace that sizes it: job 8136 (2026-11-09)
    # lost four packers to the OOM killer, job 8503 (2026-11-12) hit ENOSPC as early
    # as node [19/43] — after ~20.5 GiB of closure fetches (17.1 GiB + 3378 MiB
    # reported unpacked) — so `npm ci` and every later component failed with
    # `No space left on device`, `tar`/`pigz` wrote partial archives, and the real
    # error was 20+ lines deep, and job 8587 (2026-11-13) lost five `mksquashfs`
    # packers, the mac dmg's qemu VM and open-webui's `npm run build` to the OOM
    # killer (exit 137, bare `Killed`) while 134 GiB of disk was still free — so the
    # binding resource there was RAM, not storage. Print both ceilings (disk before
    # and after, memory before) so the next failure is attributable to a measured
    # size instead of inferred.
    - df -h / /builds /nix 2>/dev/null || df -h || true
    # Memory view for the OOM class: `free` measures the box, the cgroup files the
    # container's own limit (v2 `memory.max`/`memory.peak`, v1 `limit_in_bytes`).
    # ubi/busybox images may carry neither, hence the `|| true` chain.
    - ( free -m || cat /proc/meminfo | head -3 ) 2>/dev/null || true
    - cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || true
    - nix develop -c make bundles
    - df -h / /builds /nix 2>/dev/null || df -h || true
    - du -sh dist dist/components 2>/dev/null || true
    - nix develop -c make tarball-upload
  # 8h, not 6h. Pipeline 3098 (job 7664) proved 6h is still short: the runner's
  # store had been garbage-collected, so `make bundles` rebuilt 1041 derivations
  # and reached only node [29/43] in 5h20m before `job_token_expired` at 21934s
  # (zero error lines). The same graph took 2h25m warm (job 7586). Projected cold
  # total from 7664's per-node timings: nodes 1-25 2h19m, spa 82m, squashfs legs
  # 32m+62m, then the remaining ~14 nodes (ow-assets alone was 69m+32m+13m in
  # 7586). 8h covers that tail; `warm-deploy-cache` (build stage) removes the
  # SPA/hermes/runtime rebuilds that made up ~2h30m of the cold cost, so this is
  # headroom for the pipeline that *changes* one of those sources, not a speed
  # fix. The per-pipeline cost that remains is the impure open-webui build and
  # the KVM-packed dmgs — making `ow-assets` cacheable (FOD) is the follow-up
  # that would actually cut the runtime. Ninja buffers per-edge output, so the
  # last printed line is the last completed node — headroom is also what makes a
  # genuine hang distinguishable from a slow node.
  timeout: 8h
  environment: production
  resource_group: production
