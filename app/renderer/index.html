<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:8080 http://127.0.0.1:11434; frame-src http://127.0.0.1:8080" />
  <title>plan.ai</title>
  <link rel="stylesheet" href="tailwind.css" />
</head>
<body class="bg-canvas text-fg h-screen flex flex-col overflow-hidden">

  <!-- top chrome -->
  <header class="topbar">
    <div class="flex items-center gap-3">
      <span class="font-mono text-fg-strong font-semibold tracking-tight">plan<span class="text-brand">.ai</span></span>
      <span class="kicker">usb&nbsp;·&nbsp;offline</span>
    </div>
    <div class="topbar-controls">
      <button id="tab-dashboard" class="btn btn-sm btn-secondary">Dashboard</button>
      <button id="tab-webui" class="btn btn-sm btn-ghost" disabled>Open WebUI</button>
      <button id="theme" class="nav-icon-btn" title="Toggle theme">◐</button>
    </div>
  </header>

  <!-- DASHBOARD VIEW -->
  <main id="view-dashboard" class="h-page flex-1 overflow-auto p-6 space-y-6">
    <div>
      <div class="kicker">overview</div>
      <h1 class="h-hero">Local AI stack</h1>
    </div>

    <!-- service status cards -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-4" id="services"></section>

    <!-- facts -->
    <section class="card card-pad">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
        <div><div class="label">Ollama port</div><div class="font-mono text-fg-strong" id="f-ollama-port">—</div></div>
        <div><div class="label">WebUI port</div><div class="font-mono text-fg-strong" id="f-webui-port">—</div></div>
        <div><div class="label">Models</div><div class="font-mono td-muted truncate" id="f-models">—</div></div>
        <div><div class="label">Data</div><div class="font-mono td-muted truncate" id="f-data">—</div></div>
      </div>
      <div class="mt-4 pt-3 border-t border-line">
        <div class="label">Acceleration</div>
        <div class="flex items-baseline gap-2">
          <span id="f-accel" class="font-mono text-fg-strong">—</span>
          <span id="f-accel-why" class="help-xs td-muted"></span>
        </div>
        <ul id="f-accel-checks" class="help-xs td-muted mt-1 space-y-0.5"></ul>
      </div>
    </section>

    <!-- controls -->
    <section class="flex gap-2">
      <button id="start" class="btn btn-md btn-primary">Start all</button>
      <button id="stop" class="btn btn-md btn-secondary">Stop all</button>
      <button id="open-webui-cta" class="btn btn-md btn-accent" disabled>Open WebUI →</button>
    </section>

    <!-- logs -->
    <section class="card">
      <div class="card-pad pb-2 flex items-center justify-between">
        <div class="kicker">logs</div>
        <button id="clear-logs" class="btn btn-xs btn-ghost">clear</button>
      </div>
      <pre id="logs" class="log-output"></pre>
    </section>
  </main>

  <!-- WEBUI VIEW (embedded Open-WebUI) -->
  <div id="view-webui" class="flex-1 hidden">
    <webview id="webui" class="w-full h-full" src="about:blank"
             partition="persist:openwebui" allowpopups></webview>
  </div>

  <script src="app.js"></script>
</body>
</html>
