appId: ai.plan.usb
productName: plan.ai
copyright: plan.ai

# Pin so electron-builder never has to resolve a range from node_modules (newer
# electron-builder refuses a ranged electron version). Matches nixpkgs electron.
electronVersion: 41.7.1

directories:
  output: ../dist/bundle
  buildResources: build

# Only the thin Electron shell is packed. The rust launcher prepares the runtime,
# runs the control plane, and serves the Dioxus SPA over localhost; Electron just
# loads PLANAI_UI_URL. The heavy payload (ollama, the python runtime, offline
# assets) ships OUTSIDE the artifact as a shared components/ dir the launcher
# mounts. This keeps each launcher small and lets all platforms share components.
files:
  - main/**/*
  - package.json

linux:
  # `dir` only (linux-unpacked) — bundle.sh packs it as the app-linux-* squashfs
  # COMPONENT the standalone rust launcher mounts and runs Electron from.
  # executableName fixed so the launcher finds it.
  target:
    - dir
  executableName: plan-ai
  category: Utility

win:
  # `dir` only (win-unpacked) — bundle.sh emits it as the app-win-x64 COMPONENT
  # (a pre-extracted dir the launcher junctions in place) and ships the bare rust
  # launcher (node-mgmt.exe) standalone beside the shared components/ pool. No wine
  # needed; nsis/portable can be produced on a Windows CI runner.
  target:
    - dir

# no mac: section — mac never goes through electron-builder; bundle.sh uses
# @electron/packager + rcodesign and ships the .app as the app-mac-* dmg component.

# These are downloaded/built ahead of time; never fetch at pack time.
npmRebuild: false
buildDependenciesFromSource: false
