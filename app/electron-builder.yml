appId: ai.plan.usb
productName: plan.ai
copyright: plan.ai

# Pin so electron-builder never has to resolve a range from node_modules (newer
# electron-builder refuses a ranged electron version). Matches nixpkgs electron.
electronVersion: 41.7.1

directories:
  output: ../dist/bundle
  buildResources: build

# Only the app code is packed — a BARE launcher. The heavy payload (ollama, the
# python runtime, offline assets) ships OUTSIDE the artifact as a shared
# components/ dir beside the launcher on the USB; the loader (main/loader.js)
# finds it next to the AppImage/exe (or via PLANAI_COMPONENTS). This keeps each
# launcher small and lets all platforms share one copy of the components.
files:
  - main/**/*
  - renderer/**/*
  - package.json

# Single-file artifacts per OS.
linux:
  target:
    - AppImage
  category: Utility
  artifactName: plan-ai-${version}-linux-${arch}.${ext}

win:
  # zip needs no wine: portable/nsis targets execute the built exe under wine,
  # which fails on the minimal nix wine prefix (missing ole32.dll). The zip is a
  # single-file artifact users extract and run (plan.ai.exe). nsis/portable can
  # be produced on a Windows CI runner or with a fully-initialised wine prefix.
  target:
    - zip
  artifactName: plan-ai-${version}-win-${arch}.${ext}

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  artifactName: plan-ai-${version}-mac-${arch}.${ext}

# These are downloaded/built ahead of time; never fetch at pack time.
npmRebuild: false
buildDependenciesFromSource: false
